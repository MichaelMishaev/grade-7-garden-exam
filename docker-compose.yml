# Local-only stack. All credentials below are throwaway dev values; Resend is a dummy (no real email is sent
# unless the dummy key were valid, which it is not).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: prepx
    ports:
      - "54330:5432"
    volumes:
      - prepx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prepx"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3010:3000"
    environment:
      DATABASE_URL: postgres://postgres:dev@db:5432/prepx
      DB_WRITE_SUBMISSIONS: "1"
      DB_READ_API: "1"
      NODE_ENV: development
      PORT: "3000"
      RESEND_API_KEY: re_dummy_not_real
      RESEND_FROM_EMAIL: PrepX <dummy@example.invalid>
    command: ["sh", "-c", "node db/migrate.mjs && node db/seed.mjs && exec node server.mjs"]

volumes:
  prepx_pgdata:
