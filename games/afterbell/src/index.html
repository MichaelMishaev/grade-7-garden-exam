<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#144641"><title>עיר המפרץ · PrepX</title></head>
<body><div id="scene" aria-label="עיר חוף תלת־ממדית"></div>
<header class="mast"><b>PrepX <small>משחקי למידה</small></b><span>עיר המפרץ <i>✦</i></span></header>
<main id="welcome"><section class="poster"><div class="ticket">✦ &nbsp; הכניסה חופשית &nbsp; / &nbsp; יום הפסטיבל</div><h1>עיר המפרץ</h1><p class="premise">הבמה על המזח עוד חשוכה. בחרו תפקיד, סעו בעיר ועזרו לתושבים לפתוח את הפסטיבל.</p><form id="entry">
<div class="fields"><label>שם או כינוי<input id="player-name" maxlength="60" required autocomplete="nickname" placeholder="איך יקראו לכם בעיר?"></label><label>נושא התרגול<select id="quiz"></select></label></div>
<fieldset><legend>איזו משמרת בוחרים?</legend><div id="roles"></div></fieldset><p id="best" class="best" hidden></p>
<button id="start" class="cta" disabled>להתחיל את המשמרת ←</button><button type="button" id="resume" hidden>המשך המשמרת השמורה</button></form>
<small class="privacy">השם והתוצאה נשמרים בהיסטוריית המשחק. אין שליחת דוא״ל.</small>
<a id="campus-link" href="./campus.html">להרפתקאות הקמפוס והמסילה ↗</a></section></main>
<section id="hud" hidden><div class="jobcard"><div class="wallet-row"><button id="shop" type="button">חנות · <span id="coins">0</span> 🪙</button></div><div id="chapter" class="kicker"></div><div id="shift-bar" aria-hidden="true"><i></i><i></i><i></i></div><strong id="goal"></strong><p id="status"></p><p id="scene-report" hidden></p><div class="row"><button id="route">הובלה ליעד</button><button id="vehicle"></button><button id="map">מפה</button><button id="dispatch" aria-label="דיווחים ממוקד העיר">מוקד העיר <span id="calls"></span></button></div></div>
<div id="pin" aria-hidden="true"></div><button id="action" class="cta" hidden></button>
<div id="joystick" aria-label="בקר תנועה במגע"><span></span></div><small id="keys">חצים או WASD לתנועה · E לפעולה · V לרכב</small></section>
<section id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden><article id="sheet-body"></article></section><div id="notice" role="status"></div>
<script type="module" src="./city.js"></script></body></html>
