<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f4">
  <title>התשובות נשלחו</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f7f8f4; color: #19382e; font-family: Arial, "Noto Sans Hebrew", sans-serif; }
    main { width: min(100%, 470px); padding: 38px 30px; background: #fff; border: 1px solid #dce5db; border-radius: 22px; text-align: center; box-shadow: 0 14px 35px rgba(24,60,44,.055); }
    .mark { display: inline-grid; place-items: center; width: 62px; height: 62px; border-radius: 50%; background: #e2f2e7; color: #267449; font-size: 35px; font-weight: bold; }
    h1 { font-size: 30px; margin: 24px 0 12px; }
    p { color: #53675b; line-height: 1.7; font-size: 17px; margin: 0; }
    a { display: inline-block; margin-top: 24px; padding: 13px 20px; border-radius: 12px; background: #267449; color: white; text-decoration: none; font-weight: 700; }
    a:focus-visible { outline: 3px solid #173f2b; outline-offset: 3px; }
  </style>
</head>
<body><main><span class="mark" aria-hidden="true">✓</span><h1>כל הכבוד, סיימת!</h1><p>התשובות הועברו לשליחה.</p><a href="index.html">חזרה לכל התרגולים</a></main><script>try { sessionStorage.removeItem('garden-exam-draft-v1'); } catch (_) {}</script></body>
</html>
